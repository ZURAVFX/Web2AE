name: Publish clean Web2AE v1.0.2 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-release-v102.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-assets
          mkdir release-assets
          cd release-assets

          # Pull only the user-facing assets from the old temporary release.
          gh release download manual-v1.0 \
            -p Web2AE_v1.0.0_Companion_Windows.zip \
            -p Web2AE_v1.0.2_Firefox_Manual_Install.zip \
            -p Web2AE_v1.0.2_Chrome_Manual_Install.zip

          unzip -t Web2AE_v1.0.0_Companion_Windows.zip
          unzip -t Web2AE_v1.0.2_Firefox_Manual_Install.zip
          unzip -t Web2AE_v1.0.2_Chrome_Manual_Install.zip

          cd ..

          # Replace any incomplete v1.0.2 release cleanly.
          if gh release view v1.0.2 >/dev/null 2>&1; then
            gh release delete v1.0.2 --yes --cleanup-tag
          fi

          cat > release-notes.md <<'EOF'
          # Web2AE v1.0.2

          Turn live webpages into editable After Effects layers.

          ## Recommended install

          **Google Chrome**
          Install Web2AE from the Chrome Web Store:
          https://chromewebstore.google.com/detail/web2ae-%E2%80%94-live-web-to-afte/apfelhnjcinfnjmddlfnikepkddpdllk

          **After Effects Companion**
          Download `Web2AE_v1.0.0_Companion_Windows.zip` from the assets below. Extract it, run `Install Web2AE.bat`, restart After Effects, then open `Window > Extensions > Web2AE`.

          ## Firefox

          Firefox is not yet published on Mozilla Add-ons. `Web2AE_v1.0.2_Firefox_Manual_Install.zip` is a temporary build for testing until the signed store version is available.

          ## Chrome manual fallback

          `Web2AE_v1.0.2_Chrome_Manual_Install.zip` is included only as a temporary fallback/testing build. Most users should install from the Chrome Web Store instead.

          ## v1.0.2

          - Improved capture on YouTube and other modern app-style sites.
          - Hardened clipping around custom/zero-size wrapper elements.
          - Improved rendered text-node capture.
          - Guided first-run setup with direct After Effects Companion download and support links.

          Created by Elliot Mckenzie / zura.
          EOF

          gh release create v1.0.2 \
            release-assets/Web2AE_v1.0.0_Companion_Windows.zip \
            release-assets/Web2AE_v1.0.2_Firefox_Manual_Install.zip \
            release-assets/Web2AE_v1.0.2_Chrome_Manual_Install.zip \
            --title "Web2AE v1.0.2" \
            --notes-file release-notes.md \
            --target main

          # Remove the old messy prerelease once the clean release exists.
          if gh release view manual-v1.0 >/dev/null 2>&1; then
            gh release delete manual-v1.0 --yes --cleanup-tag
          fi
