name: Publish Web2AE browser v1.0.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-browser-v101.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build guided Chrome and Firefox packages
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="c720975b16b8ec5bad952d7dd48a7b9208fa28f2"
          COMPANION_URL="https://github.com/ZURAVFX/Web2AE/releases/download/manual-v1.0/Web2AE_v1.0.0_Companion_Windows.zip"
          PROJECT_URL="https://github.com/ZURAVFX/Web2AE"

          rm -rf browser-extension browser-base chrome-store chrome-manual firefox-manual
          rm -f Web2AE_v1.0.1_Chrome_Store.zip Web2AE_v1.0.1_Chrome_Manual_Install.zip Web2AE_v1.0.1_Firefox_Manual_Install.zip
          mkdir browser-base chrome-store chrome-manual firefox-manual

          git archive "$SOURCE_COMMIT" browser-extension | tar -x
          cp -a browser-extension/. browser-base/
          rm -rf browser-extension

          # Shared first-run UX. The extension itself explains everything needed from a clean machine.
          cat > browser-base/setup.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up Web2AE</title>
          <style>
          :root{font-family:Inter,Arial,sans-serif;color:#f2f2f2;background:#171717}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:56px auto;padding:0 24px}h1{font-size:36px;margin:0 0 8px}.sub{color:#969696;margin:0 0 28px}.card{background:#222;border:1px solid #373737;border-radius:10px;padding:20px;margin:12px 0}.step{display:flex;gap:14px}.n{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#0e639c;color:white;font-weight:800}.card h2{font-size:17px;margin:3px 0 7px}.card p{color:#aaa;margin:0;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.btn{display:inline-block;text-decoration:none;border-radius:7px;padding:11px 14px;font-weight:700}.primary{background:#0e639c;color:#fff}.secondary{border:1px solid #484848;background:#292929;color:#fff}.ready{border-color:#315b38;background:#1d2920}.note{font-size:12px;color:#777;margin-top:22px;line-height:1.5}code{background:#111;padding:2px 5px;border-radius:4px}a{color:#70b7e6}
          </style></head><body><main class="wrap">
          <h1>Set up Web2AE</h1>
          <p class="sub">Three quick steps. You only do this once.</p>

          <section class="card"><div class="step"><span class="n">1</span><div><h2>Install the After Effects Companion</h2><p>Download the companion, extract the ZIP, then double-click <b>Install Web2AE.bat</b>.</p><div class="actions"><a class="btn primary" href="https://github.com/ZURAVFX/Web2AE/releases/download/manual-v1.0/Web2AE_v1.0.0_Companion_Windows.zip" target="_blank">Download AE Companion</a><a class="btn secondary" href="https://github.com/ZURAVFX/Web2AE" target="_blank">Web2AE website / help</a></div></div></div></section>

          <section class="card"><div class="step"><span class="n">2</span><div><h2>Open Web2AE in After Effects</h2><p>Restart After Effects, then open <b>Window → Extensions → Web2AE</b>. Leave the panel open.</p></div></div></section>

          <section class="card ready"><div class="step"><span class="n">3</span><div><h2>Send your webpage</h2><p>Return to any normal webpage, click the Web2AE extension and press <b>Send Current Page to AE</b>. The extension automatically detects when the AE Companion is ready.</p></div></div></section>

          <p class="note">Need help? Visit <a href="https://github.com/ZURAVFX/Web2AE" target="_blank">github.com/ZURAVFX/Web2AE</a>. Web2AE sends captures only to the local companion at <code>127.0.0.1:17321</code>.</p>
          </main></body></html>
          EOF

          cat > browser-base/popup.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web2AE</title><link rel="stylesheet" href="popup.css"></head><body><main>
          <header><div><h1>Web2AE</h1><p>Live Web → After Effects</p></div><span class="badge">v1.0.1</span></header>
          <section class="statusCard"><div class="statusRow"><span id="dot" class="dot"></span><strong id="bridgeStatus">Checking After Effects…</strong></div><div id="pageTitle" class="pageTitle">Current tab</div><div id="pageUrl" class="pageUrl"></div></section>
          <section id="companionHelp" class="setupCard" hidden><strong>Finish setup to start capturing</strong><p><b>1.</b> Install the AE Companion.<br><b>2.</b> Restart After Effects.<br><b>3.</b> Open <b>Window → Extensions → Web2AE</b>.</p><button id="downloadCompanion" class="primary setupPrimary">Download AE Companion</button><button id="openSetup" class="secondary">Show 3-step setup</button><button id="openProject" class="linkButton">Web2AE website / help</button></section>
          <button id="send" class="primary" disabled>Send Current Page to AE</button>
          <section id="progressWrap" class="progressWrap" hidden><div class="progressHead"><span id="progressLabel">Preparing capture…</span><span id="progressPct">0%</span></div><div class="track"><div id="bar" class="bar"></div></div><div id="detail" class="detail"></div></section>
          <div id="message" class="message" aria-live="polite"></div><footer>Created by Elliot Mckenzie / zura</footer>
          </main><script src="popup.js"></script></body></html>
          EOF

          cat >> browser-base/popup.css <<'EOF'
          .setupPrimary{width:100%;margin-top:2px}.setupCard .secondary{margin-top:7px}.linkButton{width:100%;border:0;background:transparent;color:#8fb9d5;padding:9px 4px 2px;cursor:pointer;font-size:11px}.linkButton:hover{color:#b9d8ec;text-decoration:underline}
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('browser-base/popup.js')
          s=p.read_text(encoding='utf-8')
          old="$('openSetup').addEventListener('click',()=>EXT.tabs.create({url:EXT.runtime.getURL('setup.html')}));"
          new="""$('openSetup').addEventListener('click',()=>EXT.tabs.create({url:EXT.runtime.getURL('setup.html')}));
          $('downloadCompanion').addEventListener('click',()=>EXT.tabs.create({url:'https://github.com/ZURAVFX/Web2AE/releases/download/manual-v1.0/Web2AE_v1.0.0_Companion_Windows.zip'}));
          $('openProject').addEventListener('click',()=>EXT.tabs.create({url:'https://github.com/ZURAVFX/Web2AE'}));"""
          if old not in s: raise SystemExit('popup hook not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY

          # Chrome store build v1.0.1
          cp -a browser-base/. chrome-store/
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('chrome-store/manifest.json'); m=json.loads(p.read_text(encoding='utf-8'))
          m['version']='1.0.1'; m['description']='Send the current live webpage to After Effects as editable text, shapes and image layers. Local-only.'
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          (cd chrome-store && zip -qr ../Web2AE_v1.0.1_Chrome_Store.zip .)

          # Chrome manual build
          cp -a chrome-store/. chrome-manual/
          cat > chrome-manual/README.txt <<'EOF'
          Web2AE v1.0.1 — Chrome Manual Install
          1. Extract this ZIP to a permanent folder.
          2. Open chrome://extensions and enable Developer mode.
          3. Click Load unpacked and select the extracted folder.
          4. Click Web2AE. It will guide you through installing the After Effects Companion.
          EOF
          (cd chrome-manual && zip -qr ../Web2AE_v1.0.1_Chrome_Manual_Install.zip .)

          # Firefox manual build with the same guided UI.
          cp -a browser-base/. firefox-manual/
          cat > firefox-manual/manifest.json <<'EOF'
          {
            "manifest_version":3,
            "name":"Web2AE — Live Web to After Effects",
            "version":"1.0.1",
            "description":"Send the current live webpage to After Effects as editable text, shapes and image layers. Local-only.",
            "permissions":["activeTab","scripting"],
            "host_permissions":["http://127.0.0.1:17321/*"],
            "background":{"scripts":["background.js"]},
            "action":{"default_title":"Send webpage to After Effects","default_popup":"popup.html","default_icon":{"16":"icons/icon-16.png","32":"icons/icon-32.png","48":"icons/icon-48.png","128":"icons/icon-128.png"}},
            "icons":{"16":"icons/icon-16.png","32":"icons/icon-32.png","48":"icons/icon-48.png","128":"icons/icon-128.png"},
            "browser_specific_settings":{"gecko":{"id":"web2ae@zura.tools","strict_min_version":"140.0","data_collection_permissions":{"required":["browsingActivity","websiteContent"]}}}
          }
          EOF
          cat > firefox-manual/README.txt <<'EOF'
          Web2AE v1.0.1 — Firefox Temporary Add-on
          1. Extract this ZIP.
          2. Open about:debugging#/runtime/this-firefox.
          3. Click Load Temporary Add-on and choose manifest.json.
          4. Click Web2AE. It will guide you through installing the After Effects Companion.
          Firefox removes unsigned temporary add-ons after a full restart until the signed AMO build is live.
          EOF
          (cd firefox-manual && zip -qr ../Web2AE_v1.0.1_Firefox_Manual_Install.zip .)

          unzip -t Web2AE_v1.0.1_Chrome_Store.zip
          unzip -t Web2AE_v1.0.1_Chrome_Manual_Install.zip
          unzip -t Web2AE_v1.0.1_Firefox_Manual_Install.zip

      - name: Publish v1.0.1 downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="manual-v1.0"
          gh release upload "$TAG" Web2AE_v1.0.1_Chrome_Store.zip Web2AE_v1.0.1_Chrome_Manual_Install.zip Web2AE_v1.0.1_Firefox_Manual_Install.zip --clobber
          gh release edit "$TAG" --title "Web2AE v1.0 Downloads" --notes "Web2AE downloads. Browser v1.0.1 adds a guided first-run setup with direct AE Companion and support links. Chrome/Firefox manual installs are temporary while signed store versions are pending."
