name: Publish Web2AE browser v1.0.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-browser-v102.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v1.0.2 browser packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="manual-v1.0"
          rm -rf browser-base chrome-store chrome-manual firefox-manual
          rm -f Web2AE_v1.0.1_Chrome_Store.zip Web2AE_v1.0.2_Chrome_Store.zip Web2AE_v1.0.2_Chrome_Manual_Install.zip Web2AE_v1.0.2_Firefox_Manual_Install.zip
          mkdir browser-base chrome-store chrome-manual firefox-manual

          # Start from the already-published guided v1.0.1 package so the first-run UX stays identical.
          gh release download "$TAG" -p Web2AE_v1.0.1_Chrome_Store.zip
          unzip -q Web2AE_v1.0.1_Chrome_Store.zip -d browser-base

          # Harden rendered-element capture for modern app layouts such as YouTube.
          python - <<'PY'
          from pathlib import Path
          import re, json

          p = Path('browser-base/capture_page.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const CAPTURE_VERSION='1.0.0';", "const CAPTURE_VERSION='1.0.2';")

          new_clip = r'''  function clipInfo(el,r){
            let left=r.left,top=r.top,right=r.right,bottom=r.bottom,rad=radii(safeStyle(el)||{}),p=parentEl(el),guard=0;
            while(p&&p!==document.documentElement&&guard++<90){
              const st=safeStyle(p),pr=safeRect(p);
              if(st&&pr&&pr.width>.5&&pr.height>.5){
                const ox=st.overflowX||st.overflow||'visible',oy=st.overflowY||st.overflow||'visible';
                const cx=['hidden','clip','scroll','auto'].includes(ox),cy=['hidden','clip','scroll','auto'].includes(oy);
                const intersects=pr.right>left&&pr.left<right&&pr.bottom>top&&pr.top<bottom;
                if(intersects){
                  if(cx){left=Math.max(left,pr.left);right=Math.min(right,pr.right);}
                  if(cy){top=Math.max(top,pr.top);bottom=Math.min(bottom,pr.bottom);}
                  if(cx||cy){const ar=radii(st);if(ar.some(v=>v>.1))rad=ar;}
                }
              }
              p=parentEl(p);
            }
            // Some modern custom-element wrappers report zero/non-painting overflow boxes.
            // Never let such an ancestor erase a child that the browser itself says is visible.
            if(right-left<=.5||bottom-top<=.5){left=r.left;top=r.top;right=r.right;bottom=r.bottom;rad=radii(safeStyle(el)||{});}
            return{rect:{left,top,right,bottom,width:Math.max(0,right-left),height:Math.max(0,bottom-top)},radii:rad};
          }'''
          s, n = re.subn(r"  function clipInfo\(el,r\)\{.*?\n  \}\n  function effOpacity", new_clip + "\n  function effOpacity", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('clipInfo patch target not found')

          old = "function addTextNode(node,el){try{const text=clean(node.nodeValue);if(!text||!isVisible(el))return;const range=document.createRange();"
          new = "function addTextNode(node,el){try{const text=clean(node.nodeValue);if(!text)return;const es=safeStyle(el);if(!es||es.display==='none'||es.visibility==='hidden'||es.contentVisibility==='hidden'||parseFloat(es.opacity||1)===0)return;const range=document.createRange();"
          if old not in s:
              raise SystemExit('text-node patch target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Public package version + visible popup badge.
          mp = Path('browser-base/manifest.json')
          m = json.loads(mp.read_text(encoding='utf-8'))
          m['version'] = '1.0.2'
          m['description'] = 'Send the current live webpage to After Effects as editable text, shapes and image layers. Local-only.'
          mp.write_text(json.dumps(m, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          pp = Path('browser-base/popup.html')
          ps = pp.read_text(encoding='utf-8').replace('v1.0.1','v1.0.2')
          pp.write_text(ps, encoding='utf-8')
          PY

          # Chrome Web Store build.
          cp -a browser-base/. chrome-store/
          (cd chrome-store && zip -qr ../Web2AE_v1.0.2_Chrome_Store.zip .)

          # Chrome manual fallback build.
          cp -a browser-base/. chrome-manual/
          cat > chrome-manual/README.txt <<'EOF'
          Web2AE v1.0.2 — Chrome Manual Install
          The official Chrome Web Store version is available at:
          https://chromewebstore.google.com/detail/web2ae-%E2%80%94-live-web-to-afte/apfelhnjcinfnjmddlfnikepkddpdllk

          Manual fallback:
          1. Extract this ZIP to a permanent folder.
          2. Open chrome://extensions and enable Developer mode.
          3. Click Load unpacked and select the extracted folder.
          4. Click Web2AE and follow the built-in AE Companion setup.
          EOF
          (cd chrome-manual && zip -qr ../Web2AE_v1.0.2_Chrome_Manual_Install.zip .)

          # Firefox build shares the same capture fix and guided UX.
          cp -a browser-base/. firefox-manual/
          cat > firefox-manual/manifest.json <<'EOF'
          {
            "manifest_version":3,
            "name":"Web2AE — Live Web to After Effects",
            "version":"1.0.2",
            "description":"Send the current live webpage to After Effects as editable text, shapes and image layers. Local-only.",
            "permissions":["activeTab","scripting"],
            "host_permissions":["http://127.0.0.1:17321/*"],
            "background":{"scripts":["background.js"]},
            "action":{"default_title":"Send webpage to After Effects","default_popup":"popup.html","default_icon":{"16":"icons/icon-16.png","32":"icons/icon-32.png","48":"icons/icon-48.png","128":"icons/icon-128.png"}},
            "icons":{"16":"icons/icon-16.png","32":"icons/icon-32.png","48":"icons/icon-48.png","128":"icons/icon-128.png"},
            "browser_specific_settings":{"gecko":{"id":"web2ae@zura.tools","strict_min_version":"140.0","data_collection_permissions":{"required":["browsingActivity","websiteContent"]}}}
          }
          EOF
          cat > firefox-manual/README.txt <<'EOF'
          Web2AE v1.0.2 — Firefox Temporary Add-on
          1. Extract this ZIP.
          2. Open about:debugging#/runtime/this-firefox.
          3. Click Load Temporary Add-on and choose manifest.json.
          4. Click Web2AE and follow the built-in AE Companion setup.
          Firefox removes unsigned temporary add-ons after a full restart until the signed AMO build is live.
          EOF
          (cd firefox-manual && zip -qr ../Web2AE_v1.0.2_Firefox_Manual_Install.zip .)

          unzip -t Web2AE_v1.0.2_Chrome_Store.zip
          unzip -t Web2AE_v1.0.2_Chrome_Manual_Install.zip
          unzip -t Web2AE_v1.0.2_Firefox_Manual_Install.zip

      - name: Publish v1.0.2 downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="manual-v1.0"
          gh release upload "$TAG" Web2AE_v1.0.2_Chrome_Store.zip Web2AE_v1.0.2_Chrome_Manual_Install.zip Web2AE_v1.0.2_Firefox_Manual_Install.zip --clobber
          gh release edit "$TAG" --title "Web2AE v1.0 Downloads" --notes "Web2AE downloads. Browser v1.0.2 fixes modern-app/YouTube element clipping and text-node capture, while keeping the guided first-run setup. Chrome is now live on the Chrome Web Store; Firefox remains a temporary manual install until AMO publication."
