name: Publish temporary Web2AE downloads

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-manual-downloads.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build fresh Chrome, Firefox and Windows companion packages
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="c720975b16b8ec5bad952d7dd48a7b9208fa28f2"

          rm -rf browser-source chrome-manual firefox-manual browser-extension after-effects companion
          rm -f Web2AE_v1.0.0_Chrome_Manual_Install.zip Web2AE_v1.0.0_Firefox_Manual_Install.zip Web2AE_v1.0.0_Companion_Windows.zip

          # Recover known-good v1 browser and AE source from repo history without publishing source on main.
          mkdir browser-source chrome-manual firefox-manual companion
          git archive "$SOURCE_COMMIT" browser-extension | tar -x
          cp -a browser-extension/. browser-source/
          rm -rf browser-extension

          git archive "$SOURCE_COMMIT" after-effects | tar -x
          cp -a after-effects companion/after-effects
          rm -rf after-effects

          # Chrome package
          cp -a browser-source/. chrome-manual/
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('chrome-manual/manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          m['description'] = 'Send the current live webpage to After Effects as editable text, shapes and image layers. Local-only.'
          p.write_text(json.dumps(m, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          cat > chrome-manual/README.txt <<'EOF'
          Web2AE v1.0 — Chrome Manual Install

          TEMPORARY INSTALL UNTIL THE CHROME WEB STORE VERSION IS LIVE

          1. Extract this ZIP to a permanent folder on your PC.
          2. Open chrome://extensions
          3. Turn on Developer mode.
          4. Click Load unpacked.
          5. Select the extracted folder containing manifest.json.
          6. Install the Web2AE After Effects Companion separately from https://github.com/ZURAVFX/Web2AE
          7. Restart/open After Effects and choose Window > Extensions > Web2AE.
          8. Open a normal webpage, click Web2AE, then choose Send Current Page to AE.

          IMPORTANT: Do not move/delete the extracted Chrome folder while the manual extension is installed.

          Created by Elliot Mckenzie / zura
          Copyright © 2026. All rights reserved.
          EOF
          (cd chrome-manual && zip -qr ../Web2AE_v1.0.0_Chrome_Manual_Install.zip .)

          # Firefox package
          cp -a browser-source/. firefox-manual/
          cat > firefox-manual/manifest.json <<'EOF'
          {
            "manifest_version": 3,
            "name": "Web2AE — Live Web to After Effects",
            "version": "1.0.0",
            "description": "Send the current live webpage to After Effects as editable text, shapes and image layers. Local-only.",
            "permissions": ["activeTab", "scripting"],
            "host_permissions": ["http://127.0.0.1:17321/*"],
            "background": {"scripts": ["background.js"]},
            "action": {
              "default_title": "Send webpage to After Effects",
              "default_popup": "popup.html",
              "default_icon": {
                "16": "icons/icon-16.png",
                "32": "icons/icon-32.png",
                "48": "icons/icon-48.png",
                "128": "icons/icon-128.png"
              }
            },
            "icons": {
              "16": "icons/icon-16.png",
              "32": "icons/icon-32.png",
              "48": "icons/icon-48.png",
              "128": "icons/icon-128.png"
            },
            "browser_specific_settings": {
              "gecko": {
                "id": "web2ae@zura.tools",
                "strict_min_version": "140.0",
                "data_collection_permissions": {
                  "required": ["browsingActivity", "websiteContent"]
                }
              }
            }
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('firefox-manual/setup.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Chrome may request one-time high-fidelity page inspection permission.', 'Firefox uses the standard page collector; no Chrome-specific debugger permission is required.')
          p.write_text(s, encoding='utf-8')
          PY
          cat > firefox-manual/README.txt <<'EOF'
          Web2AE v1.0 — Firefox Manual Install

          TEMPORARY INSTALL UNTIL THE SIGNED FIREFOX ADD-ONS VERSION IS LIVE

          1. Extract this ZIP to a folder on your PC.
          2. Open about:debugging#/runtime/this-firefox
          3. Click Load Temporary Add-on…
          4. Select manifest.json from the extracted Web2AE folder.
          5. Install the Web2AE After Effects Companion separately from https://github.com/ZURAVFX/Web2AE
          6. Restart/open After Effects and choose Window > Extensions > Web2AE.
          7. Open a normal webpage, click Web2AE, then choose Send Current Page to AE.

          IMPORTANT: Firefox removes unsigned temporary add-ons after a full browser restart. Repeat steps 2–4 after restarting Firefox until the signed Firefox Add-ons version is available.

          Created by Elliot Mckenzie / zura
          Copyright © 2026. All rights reserved.
          EOF
          (cd firefox-manual && zip -qr ../Web2AE_v1.0.0_Firefox_Manual_Install.zip .)

          # Windows After Effects companion package
          cat > companion/README.txt <<'EOF'
          Web2AE v1.0.0 — After Effects Companion (Windows)

          1. Close After Effects.
          2. Extract this ZIP completely.
          3. Run "Install Web2AE.bat".
          4. Restart After Effects.
          5. Open Window > Extensions > Web2AE.

          The browser extension is installed separately from the Web2AE GitHub page / browser stores.

          Created by Elliot Mckenzie / zura
          Copyright © 2026. All rights reserved.
          EOF

          cat > 'companion/Install Web2AE.bat' <<'EOF'
          @echo off
          setlocal EnableExtensions
          set "AEDEST=%APPDATA%\Adobe\CEP\extensions\Web2AE"
          set "OLD_AEDEST=%APPDATA%\Adobe\CEP\extensions\Screenshot2AE"

          echo.
          echo Web2AE Companion v1.0.0
          echo Created by Elliot Mckenzie / zura
          echo.
          echo Installing After Effects extension...

          for %%V in (11 12 13 14 15) do reg add "HKCU\Software\Adobe\CSXS.%%V" /v PlayerDebugMode /t REG_SZ /d 1 /f >nul 2>&1
          if exist "%OLD_AEDEST%" rmdir /s /q "%OLD_AEDEST%"
          if exist "%AEDEST%" rmdir /s /q "%AEDEST%"
          mkdir "%AEDEST%" >nul 2>&1
          xcopy "%~dp0after-effects\*" "%AEDEST%\" /E /I /Y >nul
          if errorlevel 1 goto :fail

          echo.
          echo Web2AE installed successfully.
          echo Restart After Effects and open Window ^> Extensions ^> Web2AE.
          echo.
          pause
          exit /b 0

          :fail
          echo.
          echo ERROR: Web2AE installation failed while copying files.
          echo Please make sure the ZIP was fully extracted before running this installer.
          echo.
          pause
          exit /b 1
          EOF

          cat > 'companion/Uninstall Web2AE.bat' <<'EOF'
          @echo off
          set "AEDEST=%APPDATA%\Adobe\CEP\extensions\Web2AE"
          if exist "%AEDEST%" rmdir /s /q "%AEDEST%"
          echo Web2AE After Effects companion removed.
          pause
          EOF

          (cd companion && zip -qr ../Web2AE_v1.0.0_Companion_Windows.zip .)

          # Validate every public archive before publishing.
          unzip -t Web2AE_v1.0.0_Chrome_Manual_Install.zip
          unzip -t Web2AE_v1.0.0_Firefox_Manual_Install.zip
          unzip -t Web2AE_v1.0.0_Companion_Windows.zip

          echo "Companion contents:"
          unzip -l Web2AE_v1.0.0_Companion_Windows.zip

      - name: Publish download assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="manual-v1.0"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Web2AE v1.0 Downloads" --notes "Web2AE v1.0 browser installs and Windows After Effects companion." --prerelease
          fi
          gh release edit "$TAG" --title "Web2AE v1.0 Downloads" --notes "Web2AE v1.0 browser installs and Windows After Effects companion. Chrome and Firefox browser packages are temporary manual installs while store versions are pending."
          gh release upload "$TAG" Web2AE_v1.0.0_Chrome_Manual_Install.zip Web2AE_v1.0.0_Firefox_Manual_Install.zip Web2AE_v1.0.0_Companion_Windows.zip --clobber
