name: Standardise Web2AE v1.0.2 assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/standardise-v102-assets.yml

permissions:
  contents: write

jobs:
  standardise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename public release assets and refresh notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.2"

          gh release download "$TAG" \
            -p 'Web2AE_v1.0.0_Companion_Windows.zip' \
            -p 'Web2AE_v1.0.2_Chrome_Manual_Install.zip' \
            -p 'Web2AE_v1.0.2_Firefox_Manual_Install.zip'

          mv Web2AE_v1.0.0_Companion_Windows.zip Web2AE-v1.0.2-AE-Companion-Windows.zip
          mv Web2AE_v1.0.2_Chrome_Manual_Install.zip Web2AE-v1.0.2-Chrome-Manual-Hotfix.zip
          mv Web2AE_v1.0.2_Firefox_Manual_Install.zip Web2AE-v1.0.2-Firefox-Temporary-Addon.zip

          gh release delete-asset "$TAG" Web2AE_v1.0.0_Companion_Windows.zip -y
          gh release delete-asset "$TAG" Web2AE_v1.0.2_Chrome_Manual_Install.zip -y
          gh release delete-asset "$TAG" Web2AE_v1.0.2_Firefox_Manual_Install.zip -y

          gh release upload "$TAG" \
            Web2AE-v1.0.2-AE-Companion-Windows.zip \
            Web2AE-v1.0.2-Chrome-Manual-Hotfix.zip \
            Web2AE-v1.0.2-Firefox-Temporary-Addon.zip

          cat > release-notes.md <<'EOF'
          # Web2AE v1.0.2

          One Web2AE version number applies to the whole product: browser extension and After Effects Companion.

          ## Recommended install

          **Chrome**
          Install from the Chrome Web Store:
          https://chromewebstore.google.com/detail/web2ae-%E2%80%94-live-web-to-afte/apfelhnjcinfnjmddlfnikepkddpdllk

          **After Effects Companion**
          Download `Web2AE-v1.0.2-AE-Companion-Windows.zip` from the assets below.

          ## Temporary builds

          `Web2AE-v1.0.2-Firefox-Temporary-Addon.zip` is the temporary Firefox build until Mozilla Add-ons is live.

          `Web2AE-v1.0.2-Chrome-Manual-Hotfix.zip` is only for testing/hotfix use. Normal Chrome users should install from the Chrome Web Store.

          ## Versioning rule

          Web2AE uses one synchronized product version. Browser and After Effects Companion releases always carry the same version number, even when a release mainly changes one component.

          ## v1.0.2 changes

          - Improved capture on YouTube and modern app-style sites.
          - Hardened clipping around custom/zero-size wrapper elements.
          - Improved rendered text-node capture.
          - Guided first-run setup with direct Companion and support links.

          Created by Elliot Mckenzie / zura.
          EOF

          gh release edit "$TAG" --title 'Web2AE v1.0.2' --notes-file release-notes.md
